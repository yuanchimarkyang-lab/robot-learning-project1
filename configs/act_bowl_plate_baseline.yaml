policy:
  type: act
  device: cuda
  
  # Keep training/checkpoints local
  # the repo_id for policy is for trained model to be pushed to Hugging Face Hub
  push_to_hub: false

  # Temporal configuration
  chunk_size: 50
  n_action_steps: 10

  # Important ACT hyperparameters
  vision_backbone: resnet18
  pretrained_backbone_weights: ResNet18_Weights.IMAGENET1K_V1

  use_vae: true
  kl_weight: 10.0

  optimizer_lr: 1.0e-5
  optimizer_weight_decay: 1.0e-4
  optimizer_lr_backbone: 1.0e-5


# Reproducibility
seed: 1000
cudnn_deterministic: false


# DataLoader
batch_size: 8
num_workers: 2


# Training
steps: 1000

log_freq: 100

save_checkpoint: true
save_freq: 100

# We will perform our own closed-loop evaluation
env_eval_freq: 0
eval_steps: 0


# GPU
accelerator:
  mixed_precision: bf16

  gradient_accumulation:
    steps: 1


# Output
output_dir: /home/yjc1989/ML/robot-learning-project1/results/act_baseline
job_name: act_bowl_plate_baseline


wandb:
  enable: false
